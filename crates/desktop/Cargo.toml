[package]
name = "nt61-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
test = true

[features]
resource-gen = []

[[bin]]
name = "resource-gen"
path = "src/bin/resource-gen.rs"
test = false
required-features = ["resource-gen"]

[[bin]]
name = "explorer"
path = "src/bin/explorer/main.rs"
test = false

[[bin]]
name = "logonui"
path = "src/bin/logonui/main.rs"
test = false

[[bin]]
name = "notepad"
path = "src/bin/notepad/main.rs"
test = false

[dependencies]
nt61-abi = { path = "../abi" }
nt61-fonts = { path = "../fonts" }
# Reuse a no_std size-binned allocator for font parsing and GUI allocations.
talc = { version = "=3.1.2", default-features = false }
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
crc32fast = { version = "=1.4.2", default-features = false }
roxmltree = { version = "=0.20.0", default-features = false }

[[bin]]
name = "application-host"
path = "src/applications/native/main.rs"
test = false

[[bin]]
name = "application-preview"
path = "src/applications/preview.rs"
test = false
required-features = ["resource-gen"]

[[bin]]
name = "explorer-preview"
path = "src/bin/explorer-preview.rs"
test = false
required-features = ["resource-gen"]
