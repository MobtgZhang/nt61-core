[package]
name = "nt61-boot"
version = "0.1.0"
edition = "2021"
description = "NT6.1.7601 UEFI Boot Manager"
authors = ["NT6.1.7601 Team"]

[dependencies]
uefi = { version = "0.37.0", features = ["alloc", "logger"] }
uefi-raw = "0.14.0"
nt61-bootfs = { path = "../bootfs" }
nt61-fonts = { path = "../fonts" }

[[bin]]
name = "nt61-boot"
path = "src/main.rs"
test = false

[features]
# Architecture-specific UEFI entry points and console I/O are selected by target.
x86_64 = []
aarch64 = []
riscv64 = []
loongarch64 = []
log_level_warn = []
log_level_debug = ["log_level_warn"]

# Profile settings are inherited from the workspace root.
