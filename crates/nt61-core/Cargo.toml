[package]
name = "nt61-core"
version = "0.1.0"
edition = "2021"
authors = ["NT6.1.7601 Team"]
description = "Windows NT 6.1 kernel core implementation"
license = "MIT OR Apache-2.0"

[lib]
name = "nt61_core"
path = "src/lib.rs"
test = false

[features]
default = ["x86_64", "binary_panic", "alloc", "crypto_libs"]
std = []
uefi_boot = []
bios_boot = []
binary_panic = []
x86_64 = ["dep:x86_64", "dep:pic8259"]
aarch64 = []
loongarch64 = []
riscv64 = []
smp = []
acpi = ["dep:acpi"]
debug = []
alloc = ["dep:linked_list_allocator", "dep:hashbrown"]
btl = []
loongson_gpu = []
crypto_libs = ["dep:sha2", "dep:aes", "dep:des", "dep:hmac", "dep:rsa", "dep:rand_core"]
log_level_error = []
log_level_warn = ["log_level_error"]
log_level_info = ["log_level_warn"]
log_level_debug = ["log_level_info"]

[dependencies]
nt61-fonts = { path = "../fonts" }
linked_list_allocator = { version = "0.10", optional = true }
spin = "0.9"
bitflags = "2.3"
x86_64 = { version = "0.15", optional = true, default-features = false }
acpi = { version = "6.0", optional = true, default-features = false }
pic8259 = { version = "0.10", optional = true }
uart_16550 = "0.2"
hashbrown = { version = "0.14", optional = true }
talc = { version = "3.0", optional = true }
sha2 = { version = "0.10", optional = true, default-features = false }
aes = { version = "0.8", optional = true, default-features = false }
des = { version = "0.8", optional = true, default-features = false }
hmac = { version = "0.12", optional = true, default-features = false }
rsa = { version = "0.9", optional = true, default-features = false, features = ["pem", "sha2"] }
rand_core = { version = "0.6", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.8"
quickcheck = "1.0"
proptest = "1.2"
