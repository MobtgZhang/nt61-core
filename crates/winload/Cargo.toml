[package]
name = "nt61-winload"
version = "0.1.0"
edition = "2021"
description = "NT6.1.7601 UEFI OS Loader — winload.efi"
authors = ["NT6.1.7601 Team"]
publish = false

[dependencies]
nt61-boot-types = { path = "../boot-types" }
nt61-crypto = { path = "../crypto" }
nt61-loader = { path = "../loader" }
ntoskrnl = { path = "../ntoskrnl", features = ["binary_panic"] }
uefi = { version = "0.37.0", features = ["alloc", "logger"] }
uefi-raw = "0.14.0"
nt61-bootfs = { path = "../bootfs" }

# The OS Loader (`winload.efi`) links against the kernel
# executive crate (`ntoskrnl`) for the shared kernel heap and the
# `kernel_main` trampolines in `winload/src/arch/`. Architecture
# features are forwarded to `nt61-core` so the bare-metal kernel
# entry keeps its panic handler.
[target.'cfg(target_arch = "x86_64")'.dependencies]

[target.'cfg(target_arch = "aarch64")'.dependencies]

[target.'cfg(target_arch = "riscv64")'.dependencies]

[target.'cfg(target_arch = "loongarch64")'.dependencies]

[[bin]]
name = "nt61-winload"
path = "src/main.rs"
test = false

[features]
# winload.efi is currently enabled for the target supported by the
# loader trampolines. As additional target shims land, the required
# feature set above can be expanded.
x86_64 = []
aarch64 = []
riscv64 = []
loongarch64 = []
log_level_warn = []
log_level_debug = ["log_level_warn"]

# Profile settings are inherited from the workspace root.
