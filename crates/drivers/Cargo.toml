[package]
name = "nt61-drivers"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
test = false

[dependencies]
nt61-boot-types = { path = "../boot-types" }
ntoskrnl = { path = "../ntoskrnl" }
spin = "0.9"
libm = "0.2"
nt61-fonts = { path = "../fonts" }

[features]
test-support = []
loongson_gpu = []
log_level_error = []
log_level_warn = []
log_level_info = ["log_level_warn"]
log_level_debug = ["log_level_info"]
