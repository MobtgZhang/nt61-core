[package]
name = "nt61-tools"
version = "0.1.0"
edition = "2021"
description = "NT6.1.7601 build tools - Create disk images without shell dependencies"
publish = false

[[bin]]
name = "build-tool"
path = "src/main.rs"

# build-esp 通过 fs::build 产物管线生成 PE，不再依赖 nt61 门面
[[bin]]
name = "build-esp"
path = "src/build_esp.rs"
required-features = ["with-nt61"]

# pe-test 需要 loader 与 fs::build 产物管线
[[bin]]
name = "pe-test"
path = "src/pe_test.rs"
required-features = ["with-nt61"]

[[bin]]
name = "load-pe"
path = "src/bin/load_pe.rs"
required-features = ["with-nt61"]

# hive-gen 不依赖 nt61 门面
[[bin]]
name = "hive-gen"
path = "src/hive_gen_bin.rs"
required-features = ["with-nt61"]

# dump-cmd 读取 fs::build 产物管线中的 cmd.exe
[[bin]]
name = "dump-cmd"
path = "src/bin/dump_cmd.rs"
required-features = ["with-nt61"]

# mkcmd 不依赖 nt61——直接拼接小 PE
[[bin]]
name = "mkcmd"
path = "src/bin/mkcmd.rs"

[lib]
name = "nt61_tools"
path = "src/lib.rs"

[dependencies]
nt61-boot-types = { path = "../boot-types" }
nt61-loader = { path = "../loader" }
# hive_gen is always available
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
uuid = { version = "1.12", default-features = false }
tempfile = { version = "3.8", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
testing = ["tempfile"]
with-nt61 = ["tempfile"]
