[package]
name = "nt61"
version = "0.1.0"
edition = "2021"
authors = ["NT6.1.7601 Team"]
description = "Windows NT 6.1 (Windows 7) compatible operating system kernel written in Rust"
license = "MIT OR Apache-2.0"

[lib]
name = "nt61"
path = "src/lib.rs"

[[bin]]
name = "nt61-kernel"
path = "src/main.rs"
test = false

[[bin]]
name = "hal_dll"
path = "src/bin/hal.rs"
test = false

[features]
default = ["x86_64", "binary_panic", "alloc", "crypto_libs"]
std = []
uefi_boot = []
bios_boot = []
binary_panic = []
x86_64 = ["nt61-core/binary_panic", "nt61-core/x86_64"]
aarch64 = ["nt61-core/binary_panic", "nt61-core/aarch64"]
loongarch64 = ["nt61-core/binary_panic", "nt61-core/loongarch64"]
riscv64 = ["nt61-core/binary_panic", "nt61-core/riscv64"]
smp = ["nt61-core/smp"]
acpi = ["nt61-core/acpi"]
debug = ["nt61-core/debug"]
alloc = ["nt61-core/alloc"]
btl = ["nt61-core/btl"]
loongson_gpu = ["nt61-core/loongson_gpu"]
crypto_libs = ["nt61-core/crypto_libs"]
log_level_error = ["nt61-core/log_level_error"]
log_level_warn = ["nt61-core/log_level_warn"]
log_level_info = ["nt61-core/log_level_info"]
log_level_debug = ["nt61-core/log_level_debug"]

[dependencies]
nt61-core = { path = "../crates/nt61-core", default-features = false }

[dev-dependencies]
tempfile = "3.8"
quickcheck = "1.0"
proptest = "1.2"
